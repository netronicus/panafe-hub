    {

        },
        {
          "@type": "HowToSupply",
          "name": "Pasaporte vigente (extranjeros)"
        }
      ],
      "tool": [
        {
          "@type": "HowToTool",
          "name": "Teléfono móvil o computadora con internet"
        }
      ],
      "step": [
        {
          "@type": "HowToStep",
          "position": 1,
          "name": "Reunir documentos",
          "text": "Prepara tu CURP, INE o pasaporte. Si eres extranjero residente en México, necesitarás tu pasaporte vigente."
        },
        {
          "@type": "HowToStep",
          "position": 2,
          "name": "Acceder al portal de tu operadora",
          "text": "Selecciona tu compañía (Telcel, AT&T, Movistar, Bait, Altán, Virgin Mobile o Flash Mobile) y accede a su portal oficial de registro PANAFE."
        },
        {
          "@type": "HowToStep",
          "position": 3,
          "name": "Ingresar tus datos",
          "text": "Captura tu número de línea y los datos de tu identificación oficial (CURP, INE o pasaporte)."
        },
        {
          "@type": "HowToStep",
          "position": 4,
          "name": "Confirmar el registro",

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es el PANAFE?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "PANAFE es el nombre interno de este proyecto que se refiere al Registro de Usuarios de Telefonía Móvil (también conocido como Registro Nacional de Usuarios de Telecomunicaciones), un proceso obligatorio regulado por el IFT en México para vincular cada línea móvil a la identidad de su titular."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuál es la fecha límite para registrar mi línea?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La fecha límite para registrar tu línea móvil es el 30 de junio de 2026. Las líneas no registradas serán suspendidas a partir del 1 de julio de 2026."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué documentos necesito para registrar mi línea?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Necesitas tu CURP o INE (credencial para votar). Si eres extranjero residente en México, puedes usar tu pasaporte vigente."
          }
        },
        {
          "@type": "Question",
          "name": "¿El registro tiene algún costo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No, el registro en el PANAFE es completamente gratuito. Ninguna operadora ni el IFT te cobrará por este trámite. Si te piden pago, es una estafa."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo registrar varias líneas a mi nombre?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, puedes registrar múltiples líneas a tu nombre. Utiliza la herramienta de seguimiento de este sitio para llevar un control de todas tus líneas registradas."
          }
        }
      ]
    }
